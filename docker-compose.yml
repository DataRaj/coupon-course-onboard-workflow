services:
  db:
    image: postgres:16-alpine
    container_name: course-coupon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: course-coupon-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/marketplace?sslmode=disable
      - HTTP_ADDR=:8080
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    container_name: course-coupon-worker
    restart: unless-stopped
    entrypoint: ["/app/bin/worker"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/marketplace?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
